services:
  - type: worker
    name: football-odds-signal-bot
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: LOG_LEVEL
        value: info
