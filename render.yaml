services:
  - type: web
    name: Mudigize-odds
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node main.js
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LOG_LEVEL
        value: info
